url: https://Data-Wise.github.io/mediationverse/

template:
  bootstrap: 5
  bootswatch: litera
  bslib:
    # Consistent academic blue across ecosystem
    primary: "#0054AD"
    bg: "#ffffff"
    fg: "#212529"
    # Modern, readable fonts (consistent with medfit)
    base_font: { google: "Inter" }
    heading_font: { google: "Montserrat" }
    code_font: { google: "Fira Code" }
    font-size-base: 0.925rem

home:
  title: "mediationverse: Ecosystem for Mediation Analysis in R"
  description: >
    Meta-package that loads all core packages in the mediation analysis
    ecosystem with a single library() call. Provides unified access to
    medfit, probmed, RMediation, medrobust, medsim, and missingmed.
  sidebar:
    structure: [links, license, citation, authors, dev]
  links:
  - text: "r-universe (binaries)"
    href: https://data-wise.r-universe.dev/mediationverse
  - text: "Report Issues"
    href: https://github.com/Data-Wise/mediationverse/issues
  - text: "Request Feature"
    href: https://github.com/Data-Wise/mediationverse/issues/new

logo:
  image: man/figures/logo.png
  align: right

navbar:
  structure:
    left:  [start, reference, articles]
    right: [search, github]
  components:
    start:
      text: Get started
      href: articles/getting-started.html
    reference:
      text: Reference
      href: reference/index.html
    articles:
      text: Guides
      menu:
      - text: "A first analysis in four calls"
        href: articles/first-analysis.html
      - text: "Workflow"
        href: articles/mediationverse-workflow.html
      - text: "Ecosystem"
        href: articles/ecosystem.html
      - text: "Roadmap"
        href: articles/roadmap.html
      - text: "Contributing"
        href: articles/contributing.html
      - text: "News"
        href: news/index.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/Data-Wise/mediationverse
      aria-label: GitHub

reference:
  - title: "Package Management"
    desc: "Functions for managing the mediationverse ecosystem"
    contents:
      - mediationverse_sitrep
      - mediationverse_packages
      - mediationverse_update
      - mediationverse_conflicts
      - mediationverse_citations
      - mediationverse_news
      - mediationverse_attach_all

  - title: "Package Documentation"
    desc: "Package-level documentation"
    contents:
      - mediationverse-package

development:
  mode: auto
  version_label: default
  version_tooltip: "Development version"

authors:
  Davood Tofighi:
    href: "https://orcid.org/0000-0001-8523-7776"
    html: "<img src='https://orcid.org/sites/default/files/images/orcid_16x16.png' height='16' width='16' alt='ORCID iD icon'> Davood Tofighi"

footer:
  structure:
    left: [developed_by, built_with]
    center: [ecosystem, status]
    right: [package_version]
  components:
    package_version: "Version {version}"
    developed_by: |
      Developed by [Davood Tofighi](https://orcid.org/0000-0001-8523-7776)
    built_with: |
      Built with [pkgdown](https://pkgdown.r-lib.org/)
    ecosystem: |
      **Ecosystem:** [medfit](https://Data-Wise.github.io/medfit/),
      [probmed](https://Data-Wise.github.io/probmed/),
      [RMediation](https://Data-Wise.github.io/rmediation/),
      [medrobust](https://Data-Wise.github.io/medrobust/),
      [missingmed](https://Data-Wise.github.io/missingmed/),
      [medsim](https://Data-Wise.github.io/medsim/)
    status: |
      **Status:** [Package dashboard](https://github.com/Data-Wise/mediationverse/blob/main/STATUS.md),
      [Planning hub](https://github.com/Data-Wise/mediation-planning/blob/main/PROJECT-HUB.md),
      [Ecosystem coordination](https://github.com/Data-Wise/mediation-planning/blob/main/docs/ECOSYSTEM-COORDINATION.md)
